# 手动触发：构建 Windows 安装包并上传 setup.exe artifact。
#
# 不在 push 上自动跑：内嵌 Python 运行时约 391 MB，pip 下载/编译时间不可控，
# 且安装包发布需要负责人批准（见 docs/安装包制作与交接.md §9 / B-207）。
#
# 依赖链（全部是仓库内脚本，不复制一份打包逻辑）：
#   native/launcher/build.bat → launcher.exe
#   installer/build_installer.bat → payload + embedded runtime + ISCC
#
# CI 分支：build_installer.bat / native/launcher/build.bat 在 CI=1 时跳过 pause。

name: installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Go (launcher.exe)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after choco install" }
          "ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build launcher.exe
        shell: cmd
        run: native\launcher\build.bat

      - name: Build installer
        shell: cmd
        env:
          PY: python
        run: installer\build_installer.bat

      - name: Show artifact
        shell: pwsh
        run: |
          Get-ChildItem outputs\releases\*-setup.exe | ForEach-Object {
            Write-Output ("$($_.Name)  $($_.Length) bytes")
            Get-FileHash $_.FullName -Algorithm SHA256
          }

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: SphereMotion-setup
          path: outputs/releases/*-setup.exe
          if-no-files-found: error
          retention-days: 7
