# 云端的自动门：与本地 `.githooks/pre-push` 跑同一条判据链。
#
# 2026-11-22 首次真跑：连爆两个本地永远看不到的差异，都在这一轮修掉 ——
#   1) runner stdout 是 cp1252，check_standards.py 一 print 中文标题就
#      UnicodeEncodeError 崩（本地 UTF-8 从不触发）→ env.PYTHONIOENCODING=utf-8
#      一处覆盖所有步骤（含 run_tests 的 26 个子进程）。
#   2) actions/checkout 默认 fetch-depth:1 浅克隆，git log 只剩 1 条，
#      待办表里所有历史 commit hash 都误报「查不到」→ fetch-depth:0 取全历史。
# 连带：待办详情引用的 planbooks/outputs 本就被 .gitignore 排除，本地有、CI 没有，
# check_standards 的「文件不存在」判据改用 git check-ignore 区分「丢失」与「本就不入库」。
# 这就是"必须在 runner 上真跑一次"的价值：本地绿不等于云端绿。
#
# 首次跑之前（2026-10-27）本地能验的都验了：
#   · 干净 checkout 里 `run_tests fast -j 4` → 23/23（104.7s，见交接文档 §27）
#   · `check_standards` 在干净 checkout 里四类全绿（同上）
#   · YAML 能被 parser 解析
# 本地验不了的：runner 编码 / tkinter / opencv wheel / 耗时 —— 编码那条已踩中。
#
# 为什么是 windows-latest 而不是 ubuntu
# -------------------------------------
# 3 个测试 import tkinter（entrypoints / launcher_params / task_manager），
# 项目路径与编码也按 Windows 写的。ubuntu 上这几个必红，而那种红**不是缺陷**，
# 只会训练人忽略 CI。要么在 Windows 上跑真的，要么不跑。
#
# 为什么跑 fast 而不是 full
# -------------------------
# `fast` 在**没有 timings.json 的机器上会跑全部 23 个**（除 NEVER_FAST 的
# `selftest_mutation_guards`）—— 也就是说 CI 上它已经是"除了那个改源码的变异测试，
# 其余全跑"。变异测试要临时改工作区源码，在 CI 里跑没有额外价值，还慢 100 秒。

name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消旧的那次 —— 门要的是"最新一次绿"，不是"每次都跑完"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    # runner 默认 stdout=cp1252，中文 print 会 UnicodeEncodeError 崩；统一成 UTF-8。
    # 放在 job 级一次覆盖所有步骤及其子进程（check_standards / run_tests / 26 selftest）。
    env:
      PYTHONIOENCODING: utf-8
      # 8 个依赖本机标定资产 / 真实 GUI 显示器的测试在 runner 上无法运行：
      # 由本地 pre-push 门全量覆盖（每次 push 都跑 26/26），CI 显式跳过并打印原因。
      # 名单与逐条原因在 apps/run_tests.py 的 CI_LOCAL_ASSET_SKIP。
      CI_SKIP_LOCAL_ASSET_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # 待办表 done 条目用 commit=<短hash> 对账；浅克隆只剩 1 条 log 会全误报。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 本地是 3.14.7；这里稳一档用 3.13 —— opencv 的 cp313 wheel 早就齐了，
          # 3.14 的还在陆续补齐，CI 不该拿"能不能装上依赖"当不确定性来源。
          python-version: "3.13"
          cache: pip

      - name: 装依赖（只装 requirements.txt，不装 AI 后端）
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: 规范落差自查（引用 / 来源 / 计数 / 待办）
        run: python apps/tools/check_standards.py

      - name: 多语言硬门禁（每条中文必须有完整英文）
        run: python apps/tools/i18n_extract.py --check

      - name: 回归测试（fast，并行；名单来自 timings.json，缺失时跑全部）
        run: python apps/run_tests.py fast -j auto

      - name: 存下结果 JSON（失败也存，否则看不出哪一步红的）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: outputs/test_results/
          if-no-files-found: ignore
